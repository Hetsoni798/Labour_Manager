<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Site Manager"/>
<meta name="theme-color" content="#1c1c1e"/>
<title>Site Manager</title>
<link rel="manifest" id="manifest-placeholder"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="stylesheet" href="site_manager.css"/>
</head>
<body>

<!-- Install Banner -->
<div id="install-banner">
  <span>📲 Install app on your phone!</span>
  <button onclick="installApp()">Install</button>
  <button onclick="document.getElementById('install-banner').style.display='none'" style="background:transparent;color:#1a1a1a;border:1px solid #1a1a1a">✕</button>
</div>

<!-- Header -->
<div class="hdr">
  <div class="hdr-inner">
    <div>
      <p class="hdr-sub">Construction Site Manager</p>
      <h1 class="hdr-title" id="hdr-title">Workers</h1>
    </div>
    <div class="hdr-actions">
      <button class="hdr-icon-btn" onclick="whatsappExport()" title="Share"><i class="ti ti-brand-whatsapp" style="font-size:18px;color:#25D366"></i></button>
      <button class="hdr-icon-btn" onclick="openModal('expense')" title="Add Expense"><i class="ti ti-receipt" style="font-size:18px;color:#E8921A"></i></button>
      <button class="hdr-icon-btn" onclick="openSiteSwitcher()" title="Sites"><i class="ti ti-building" style="font-size:18px;color:#aaa"></i></button>
    </div>
  </div>
  <div class="site-bar" id="site-bar" style="margin:8px -14px -10px;padding:6px 14px 8px;border-top:1px solid #2a2a2a"></div>
</div>
<div class="top-tabs" id="top-tabs">
  <button class="top-tab active" onclick="setTab('workers')" id="tab-workers">
    <i class="ti ti-users"></i><span>Workers</span>
  </button>
  <button class="top-tab" onclick="setTab('tasks')" id="tab-tasks">
    <i class="ti ti-checklist"></i><span>Tasks</span>
  </button>
  <button class="top-tab" onclick="setTab('diary')" id="tab-diary">
    <i class="ti ti-notebook"></i><span>Diary</span>
  </button>
  <button class="top-tab" onclick="setTab('finance')" id="tab-finance">
    <i class="ti ti-chart-bar"></i><span>Finance</span>
  </button>
  <button class="top-tab" onclick="setTab('more')" id="tab-more">
    <i class="ti ti-dots"></i><span>More</span>
  </button>
</div>

<!-- Summary -->
<div class="summary">
  <div class="sum-cell"><p class="sum-label">Present</p><p class="sum-val" id="s-present">0/0</p></div>
  <div class="sum-cell"><p class="sum-label">Wages</p><p class="sum-val" id="s-wages">₹0</p></div>
  <div class="sum-cell"><p class="sum-label">Paid</p><p class="sum-val" id="s-paid" style="color:#4ade80">₹0</p></div>
  <div class="sum-cell"><p class="sum-label">Expenses</p><p class="sum-val" id="s-expenses" style="color:#f87171">₹0</p></div>
</div>

<!-- Date Strip -->
<div class="date-strip" id="date-strip">
  <span class="date-lbl">📅</span>
  <input type="date" id="sel-date" onchange="onDateChange()"/>
  <button class="today-btn" onclick="resetToday()">Today</button>
</div>

<!-- Content -->
<div class="content" id="content"></div>

<!-- Floating Expense Button -->
<button class="exp-fab" onclick="openModal('expense')" id="exp-fab" title="Add Expense">
  <i class="ti ti-receipt" style="font-size:20px"></i>
  <span>Expense</span>
</button>

<!-- Overlay -->
<div class="overlay" id="overlay" style="display:none" onclick="closeModal(event)"></div>

<script src="site_manager.js"></script>
</body>
</html>
